<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HANIFE INDUSTRY | Premium Industrial Solutions</title>

<meta name="description"
content="HANIFE INDUSTRY - Premium industrial solutions, products and professional services. CEO ALI.">

<style>

/* =========================
   GLOBAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#050505;
    color:#fff;
    overflow-x:hidden;
}

:root{
    --red:#e50914;
    --red2:#ff2631;
    --black:#050505;
    --dark:#0b0b0b;
    --dark2:#111;
    --card:#151515;
    --border:rgba(255,255,255,.09);
    --gray:#aaa;
}

a{
    text-decoration:none;
    color:inherit;
}

img{
    max-width:100%;
    display:block;
}

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
}

section{
    padding:100px 0;
}

::selection{
    background:var(--red);
    color:white;
}


/* =========================
   PRELOADER
========================= */

#loader{
    position:fixed;
    inset:0;
    background:#050505;
    z-index:99999;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:1s;
}

.loader-box{
    text-align:center;
}

.loader-logo{
    font-size:30px;
    font-weight:900;
    letter-spacing:3px;
}

.loader-logo span{
    color:var(--red);
}

.loader-line{
    width:180px;
    height:3px;
    background:#222;
    margin:20px auto;
    overflow:hidden;
}

.loader-line div{
    width:50%;
    height:100%;
    background:var(--red);
    animation:loading 1.2s infinite;
}

@keyframes loading{
    0%{transform:translateX(-100%)}
    100%{transform:translateX(300%)}
}


/* =========================
   HEADER
========================= */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:5000;
    background:rgba(3,3,3,.82);
    backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(255,255,255,.07);
}

.navbar{
    height:78px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:24px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:var(--red);
}

.logo small{
    display:block;
    font-size:7px;
    letter-spacing:4px;
    color:#888;
    margin-top:-3px;
}

nav{
    display:flex;
    gap:28px;
    align-items:center;
}

nav a{
    color:#ddd;
    font-size:14px;
    font-weight:bold;
    transition:.3s;
    position:relative;
}

nav a:after{
    content:"";
    position:absolute;
    left:0;
    bottom:-8px;
    width:0;
    height:2px;
    background:var(--red);
    transition:.3s;
}

nav a:hover{
    color:white;
}

nav a:hover:after{
    width:100%;
}

.nav-btn{
    padding:11px 18px;
    background:var(--red);
    border-radius:5px;
    color:white !important;
}

.nav-btn:after{
    display:none;
}

.menu{
    display:none;
    font-size:30px;
    cursor:pointer;
}


/* =========================
   HERO
========================= */

.hero{
    min-height:100vh;
    position:relative;
    display:flex;
    align-items:center;
    overflow:hidden;
    background:
        linear-gradient(90deg,
        rgba(0,0,0,.96) 0%,
        rgba(0,0,0,.72) 45%,
        rgba(0,0,0,.35) 100%),
        url("https://images.unsplash.com/photo-1504917595217-d4dc5ebe6122?auto=format&fit=crop&w=2200&q=90")
        center/cover;
}

.hero:before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    right:-150px;
    top:20%;
    border:1px solid rgba(255,0,0,.2);
    border-radius:50%;
    box-shadow:
        0 0 0 80px rgba(255,0,0,.025),
        0 0 0 160px rgba(255,0,0,.02);
    animation:rotate 20s linear infinite;
}

@keyframes rotate{
    from{transform:rotate(0)}
    to{transform:rotate(360deg)}
}

.hero-content{
    position:relative;
    z-index:2;
    padding-top:80px;
}

.hero-tag{
    display:inline-flex;
    align-items:center;
    gap:10px;
    border:1px solid rgba(255,0,0,.5);
    background:rgba(255,0,0,.08);
    padding:9px 17px;
    border-radius:50px;
    color:#eee;
    font-size:12px;
    font-weight:bold;
    letter-spacing:1.5px;
    margin-bottom:25px;
}

.live-dot{
    width:7px;
    height:7px;
    background:var(--red);
    border-radius:50%;
    box-shadow:0 0 12px var(--red);
}

.hero h1{
    font-size:clamp(55px,9vw,115px);
    line-height:.9;
    font-weight:950;
    letter-spacing:-4px;
    max-width:950px;
}

.hero h1 span{
    color:var(--red);
    text-shadow:0 0 35px rgba(229,9,20,.2);
}

.hero-sub{
    max-width:650px;
    color:#bbb;
    font-size:18px;
    line-height:1.8;
    margin:30px 0;
}

.hero-buttons{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:15px 25px;
    border-radius:6px;
    font-size:14px;
    font-weight:bold;
    transition:.35s;
    cursor:pointer;
    border:none;
}

.btn-red{
    background:var(--red);
    color:white;
    box-shadow:0 10px 35px rgba(229,9,20,.18);
}

.btn-red:hover{
    background:var(--red2);
    transform:translateY(-4px);
    box-shadow:0 15px 40px rgba(229,9,20,.35);
}

.btn-outline{
    border:1px solid #555;
    color:white;
    background:rgba(0,0,0,.25);
}

.btn-outline:hover{
    border-color:white;
    background:white;
    color:#000;
}

.hero-bottom{
    margin-top:65px;
    display:flex;
    gap:50px;
}

.hero-mini strong{
    display:block;
    font-size:25px;
}

.hero-mini span{
    color:#777;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
}


/* =========================
   SECTION TITLE
========================= */

.section-heading{
    text-align:center;
    margin-bottom:60px;
}

.section-heading .overline{
    color:var(--red);
    font-size:12px;
    letter-spacing:3px;
    font-weight:bold;
}

.section-heading h2{
    font-size:48px;
    margin:10px 0;
}

.section-heading p{
    max-width:650px;
    margin:auto;
    color:#888;
    line-height:1.8;
}


/* =========================
   ABOUT
========================= */

.about{
    background:#090909;
}

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:70px;
    align-items:center;
}

.about-image{
    height:520px;
    border-radius:14px;
    overflow:hidden;
    position:relative;
    background:
        linear-gradient(180deg,transparent 40%,rgba(0,0,0,.85)),
        url("https://images.unsplash.com/photo-1565610222536-ef125c59da2e?auto=format&fit=crop&w=1300&q=90")
        center/cover;
    border:1px solid var(--border);
}

.about-image-label{
    position:absolute;
    bottom:25px;
    left:25px;
}

.about-image-label strong{
    font-size:28px;
}

.about-image-label span{
    display:block;
    color:#aaa;
    font-size:12px;
    letter-spacing:2px;
}

.about-text .small-title{
    color:var(--red);
    font-weight:bold;
    letter-spacing:2px;
    font-size:12px;
}

.about-text h3{
    font-size:42px;
    margin:12px 0 20px;
}

.about-text h3 span{
    color:var(--red);
}

.about-text p{
    color:#999;
    line-height:1.9;
    margin-bottom:18px;
}

.about-list{
    margin-top:25px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.about-list div{
    padding:14px;
    background:#111;
    border:1px solid var(--border);
    border-radius:7px;
    font-size:13px;
}

.about-list b{
    color:var(--red);
}


/* =========================
   SERVICES
========================= */

.services{
    background:#050505;
}

.service-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.service-card{
    position:relative;
    padding:35px;
    min-height:250px;
    border:1px solid var(--border);
    background:linear-gradient(145deg,#151515,#0b0b0b);
    border-radius:12px;
    overflow:hidden;
    transition:.4s;
}

.service-card:before{
    content:"";
    position:absolute;
    width:130px;
    height:130px;
    right:-50px;
    top:-50px;
    background:var(--red);
    filter:blur(70px);
    opacity:.12;
}

.service-card:hover{
    transform:translateY(-10px);
    border-color:rgba(229,9,20,.6);
}

.service-number{
    position:absolute;
    top:20px;
    right:25px;
    color:#333;
    font-size:35px;
    font-weight:900;
}

.service-icon{
    font-size:40px;
    margin-bottom:25px;
}

.service-card h3{
    font-size:21px;
    margin-bottom:12px;
}

.service-card p{
    color:#888;
    line-height:1.7;
    font-size:14px;
}


/* =========================
   PRODUCTS
========================= */

.products{
    background:#0c0c0c;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.product-card{
    height:380px;
    position:relative;
    overflow:hidden;
    border-radius:12px;
    border:1px solid var(--border);
    background-size:cover;
    background-position:center;
    transition:.5s;
}

.product-card:nth-child(1){
    background-image:url("https://images.unsplash.com/photo-1581094794329-c8112a89af12?auto=format&fit=crop&w=1100&q=90");
}

.product-card:nth-child(2){
    background-image:url("https://images.unsplash.com/photo-1581092918056-0c4c3acd3789?auto=format&fit=crop&w=1100&q=90");
}

.product-card:nth-child(3){
    background-image:url("https://images.unsplash.com/photo-1565793298595-6a879b1d9492?auto=format&fit=crop&w=1100&q=90");
}

.product-card:before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(transparent 30%,rgba(0,0,0,.95));
}

.product-card:hover{
    transform:scale(1.025);
}

.product-content{
    position:absolute;
    left:25px;
    right:25px;
    bottom:25px;
}

.product-content small{
    color:#ff4a52;
    font-weight:bold;
    letter-spacing:2px;
}

.product-content h3{
    font-size:25px;
    margin:7px 0;
}

.product-content p{
    color:#aaa;
    font-size:13px;
}


/* =========================
   STATS
========================= */

.stats{
    padding:75px 0;
    background:
        linear-gradient(90deg,rgba(120,0,0,.88),rgba(229,9,20,.75)),
        url("https://images.unsplash.com/photo-1531058020387-3be344556be6?auto=format&fit=crop&w=2000&q=90")
        center/cover;
}

.stat-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    text-align:center;
}

.stat{
    padding:20px;
    border-right:1px solid rgba(255,255,255,.25);
}

.stat:last-child{
    border-right:none;
}

.stat h3{
    font-size:50px;
    font-weight:900;
}

.stat p{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:2px;
    opacity:.8;
}


/* =========================
   CEO
========================= */

.ceo{
    background:#050505;
}

.ceo-card{
    display:grid;
    grid-template-columns:400px 1fr;
    min-height:480px;
    background:#111;
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
}

.ceo-photo{
    position:relative;
    min-height:480px;
    background:#0b0b0b;
}

.ceo-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
}

.ceo-photo:after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(90deg,transparent 60%,#111);
    pointer-events:none;
}

.ceo-info{
    padding:65px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.ceo-info small{
    color:var(--red);
    letter-spacing:3px;
    font-weight:bold;
}

.ceo-info h2{
    font-size:55px;
    margin:8px 0;
}

.ceo-info h2 span{
    color:var(--red);
}

.ceo-role{
    color:#777;
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:25px;
}

.ceo-info p{
    color:#999;
    line-height:1.9;
    max-width:650px;
}

.ceo-points{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin:25px 0;
}

.ceo-points span{
    padding:10px 14px;
    background:#181818;
    border:1px solid #282828;
    border-radius:5px;
    font-size:12px;
}


/* =========================
   WHY US
========================= */

.why{
    background:#0c0c0c;
}

.why-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.why-card{
    padding:30px 20px;
    text-align:center;
    border:1px solid var(--border);
    border-radius:10px;
    background:#111;
}

.why-card .big{
    font-size:35px;
    margin-bottom:15px;
}

.why-card h3{
    font-size:17px;
    margin-bottom:8px;
}

.why-card p{
    color:#777;
    font-size:13px;
}


/* =========================
   TESTIMONIALS
========================= */

.testimonials{
    background:#050505;
}

.testimonial-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.testimonial{
    padding:30px;
    border:1px solid var(--border);
    background:#111;
    border-radius:10px;
    position:relative;
}

.quote{
    font-size:45px;
    color:var(--red);
    line-height:1;
}

.stars{
    color:#ffca28;
    margin:12px 0;
    letter-spacing:3px;
}

.testimonial p{
    color:#999;
    line-height:1.8;
    font-size:14px;
}

.client{
    margin-top:22px;
    padding-top:18px;
    border-top:1px solid #222;
}

.client strong{
    display:block;
}

.client span{
    color:#666;
    font-size:12px;
}


/* =========================
   CONTACT
========================= */

.contact{
    background:#0a0a0a;
}

.contact-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.contact-box{
    padding:40px;
    background:#111;
    border:1px solid var(--border);
    border-radius:12px;
}

.contact-box h3{
    font-size:27px;
    margin-bottom:25px;
}

.contact-item{
    display:flex;
    gap:15px;
    align-items:flex-start;
    padding:18px 0;
    border-bottom:1px solid #222;
}

.contact-icon{
    width:40px;
    height:40px;
    border-radius:7px;
    background:rgba(229,9,20,.1);
    border:1px solid rgba(229,9,20,.25);
    display:flex;
    justify-content:center;
    align-items:center;
}

.contact-item strong{
    display:block;
    font-size:13px;
}

.contact-item span,
.contact-item a{
    color:#888;
    font-size:13px;
}

.contact-form input,
.contact-form textarea{
    width:100%;
    background:#080808;
    border:1px solid #282828;
    color:white;
    padding:15px;
    margin-bottom:15px;
    border-radius:6px;
    outline:none;
    font-family:inherit;
}

.contact-form input:focus,
.contact-form textarea:focus{
    border-color:var(--red);
}

.contact-form textarea{
    height:130px;
    resize:none;
}


/* =========================
   WHATSAPP
========================= */

.whatsapp{
    position:fixed;
    right:22px;
    bottom:22px;
    width:62px;
    height:62px;
    border-radius:50%;
    background:#25D366;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:7000;
    box-shadow:0 8px 30px rgba(0,0,0,.5);
    animation:whatsappPulse 2s infinite;
}

.whatsapp svg{
    width:30px;
    height:30px;
    fill:white;
}

@keyframes whatsappPulse{
    0%,100%{
        box-shadow:0 0 0 0 rgba(37,211,102,.4),
                   0 8px 30px rgba(0,0,0,.5);
    }
    50%{
        box-shadow:0 0 0 14px rgba(37,211,102,0),
                   0 8px 30px rgba(0,0,0,.5);
    }
}


/* =========================
   FOOTER
========================= */

footer{
    background:#030303;
    border-top:1px solid #222;
    padding:55px 0 25px;
}

.footer-grid{
    display:grid;
    grid-template-columns:1.5fr 1fr 1fr;
    gap:40px;
    padding-bottom:40px;
}

.footer-brand h2{
    font-size:25px;
    letter-spacing:2px;
}

.footer-brand h2 span{
    color:var(--red);
}

.footer-brand p{
    color:#666;
    max-width:400px;
    margin-top:15px;
    line-height:1.8;
    font-size:13px;
}

footer h4{
    margin-bottom:18px;
}

footer ul{
    list-style:none;
}

footer li{
    margin:9px 0;
    color:#666;
    font-size:13px;
}

footer li a:hover{
    color:var(--red);
}

.copyright{
    border-top:1px solid #181818;
    padding-top:22px;
    color:#555;
    text-align:center;
    font-size:12px;
}


/* =========================
   REVEAL
========================= */

.reveal{
    opacity:0;
    transform:translateY(35px);
    transition:1s ease;
}

.reveal.show{
    opacity:1;
    transform:translateY(0);
}


/* =========================
   MOBILE
========================= */

@media(max-width:900px){

    nav{
        display:none;
        position:absolute;
        top:78px;
        left:0;
        width:100%;
        background:#080808;
        padding:25px;
        flex-direction:column;
        align-items:flex-start;
        gap:20px;
        border-bottom:1px solid #222;
    }

    nav.active{
        display:flex;
    }

    .menu{
        display:block;
    }

    .about-grid,
    .ceo-card,
    .contact-grid{
        grid-template-columns:1fr;
    }

    .service-grid,
    .product-grid,
    .testimonial-grid{
        grid-template-columns:1fr 1fr;
    }

    .why-grid{
        grid-template-columns:1fr 1fr;
    }

    .stat-grid{
        grid-template-columns:1fr 1fr;
    }

    .stat{
        border-right:none;
        border-bottom:1px solid rgba(255,255,255,.2);
    }

    .ceo-photo{
        height:500px;
    }

    .ceo-info{
        padding:45px 30px;
    }

    .footer-grid{
        grid-template-columns:1fr 1fr;
    }
}


@media(max-width:600px){

    section{
        padding:70px 0;
    }

    .container{
        width:92%;
    }

    .navbar{
        height:68px;
    }

    .logo{
        font-size:19px;
    }

    .hero{
        min-height:100svh;
    }

    .hero-content{
        padding-top:60px;
    }

    .hero h1{
        font-size:50px;
        letter-spacing:-2px;
    }

    .hero-sub{
        font-size:15px;
    }

    .hero-bottom{
        gap:25px;
        flex-wrap:wrap;
        margin-top:40px;
    }

    .hero-mini strong{
        font-size:20px;
    }

    .section-heading{
        margin-bottom:40px;
    }

    .section-heading h2{
        font-size:34px;
    }

    .about-grid,
    .service-grid,
    .product-grid,
    .testimonial-grid,
    .why-grid,
    .contact-grid{
        grid-template-columns:1fr;
    }

    .about-image{
        height:330px;
    }

    .about-text h3{
        font-size:32px;
    }

    .about-list{
        grid-template-columns:1fr;
    }

    .product-card{
        height:330px;
    }

    .stat-grid{
        grid-template-columns:1fr 1fr;
    }

    .stat h3{
        font-size:35px;
    }

    .ceo-card{
        display:block;
    }

    .ceo-photo{
        height:430px;
        min-height:0;
    }

    .ceo-photo:after{
        background:linear-gradient(0deg,#111,transparent 60%);
    }

    .ceo-info{
        padding:35px 22px;
    }

    .ceo-info h2{
        font-size:42px;
    }

    .footer-grid{
        grid-template-columns:1fr;
    }

    .whatsapp{
        width:56px;
        height:56px;
        right:15px;
        bottom:15px;
    }
}

</style>
</head>


<body>


<!-- PRELOADER -->

<div id="loader">
