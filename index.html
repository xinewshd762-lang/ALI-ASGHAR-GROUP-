<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HANIFE INDUSTRY | Premium Industrial Solutions</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

:root{
--gold:#d9ad38;
--gold2:#ffe48a;
--dark:#030405;
--card:#0c0f10;
--muted:#858b90;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:
radial-gradient(circle at 10% 10%,rgba(217,173,56,.05),transparent 25%),
radial-gradient(circle at 90% 60%,rgba(217,173,56,.04),transparent 30%),
#030405;
color:#fff;
line-height:1.5;
overflow-x:hidden;
}

a{
text-decoration:none;
color:inherit;
}

.container{
width:90%;
max-width:1200px;
margin:auto;
}

section{
padding:70px 0;
border-bottom:1px solid #1b1d1e;
position:relative;
}

.label{
color:var(--gold2);
font-size:8px;
font-weight:bold;
letter-spacing:2.5px;
margin-bottom:8px;
}

.title{
font-size:35px;
line-height:1.05;
}

.title span{
color:var(--gold2);
}

.desc{
color:#858b90;
font-size:10px;
max-width:650px;
margin-top:12px;
}

/* TOP */

.topbar{
height:30px;
display:flex;
align-items:center;
justify-content:center;
gap:8px;
overflow:hidden;
white-space:nowrap;
background:#010101;
border-bottom:1px solid #80651d;
color:#777;
font-size:8px;
letter-spacing:1.5px;
}

.topbar b{
color:var(--gold2);
}

/* HEADER */

header{
height:70px;
position:sticky;
top:0;
z-index:999;
background:rgba(3,5,6,.9);
backdrop-filter:blur(18px);
border-bottom:1px solid #252728;
box-shadow:0 10px 35px rgba(0,0,0,.7);
}

.nav{
height:100%;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:20px;
font-weight:900;
letter-spacing:1px;
}

.logo span{
color:var(--gold2);
}

.logo small{
display:block;
color:#666;
font-size:6px;
letter-spacing:3px;
text-align:center;
}

.menu{
display:flex;
list-style:none;
gap:22px;
}

.menu a{
font-size:9px;
font-weight:bold;
transition:.3s;
}

.menu a:hover{
color:var(--gold2);
text-shadow:0 0 15px rgba(255,228,138,.5);
}

.menu-btn{
display:none;
font-size:27px;
color:var(--gold2);
cursor:pointer;
}

/* HERO */

.hero{
min-height:650px;
display:flex;
align-items:center;
position:relative;
overflow:hidden;

background:
linear-gradient(
90deg,
rgba(0,0,0,.98),
rgba(0,0,0,.88) 35%,
rgba(0,0,0,.38) 75%,
rgba(0,0,0,.65)
),
url("https://images.unsplash.com/photo-1581094794329-c8112a89af12?auto=format&fit=crop&w=2200&q=90")
center/cover no-repeat;
}

.hero:after{
content:"";
position:absolute;
right:-20%;
top:-30%;
width:70%;
height:160%;
background:linear-gradient(135deg,transparent,rgba(217,173,56,.08),transparent);
transform:rotate(10deg);
}

.hero-content{
position:relative;
z-index:2;
max-width:680px;
}

.badge{
display:inline-block;
padding:8px 16px;
border:1px solid var(--gold);
border-radius:4px;
color:var(--gold2);
font-size:9px;
font-weight:bold;
letter-spacing:2px;
background:rgba(0,0,0,.35);
box-shadow:0 0 20px rgba(217,173,56,.12);
}

.hero h1{
margin-top:22px;
font-size:clamp(55px,9vw,100px);
line-height:.84;
letter-spacing:-5px;
text-shadow:5px 5px 0 #080808,0 0 40px rgba(255,255,255,.08);
}

.hero h1 span{
color:var(--gold2);
text-shadow:4px 4px 0 #624b0b,0 0 35px rgba(217,173,56,.35);
}

.hero p{
max-width:570px;
margin:27px 0;
color:#b9bdc0;
font-size:13px;
}

.buttons{
display:flex;
flex-wrap:wrap;
gap:14px;
}

.btn{
display:inline-block;
padding:14px 25px;
border:1px solid var(--gold);
font-size:9px;
font-weight:bold;
transition:.35s;
box-shadow:0 7px 0 #5b470c,0 15px 30px rgba(0,0,0,.7);
}

.btn-primary{
color:#080808;
background:linear-gradient(145deg,#fff0a0,#d9ad38);
}

.btn-outline{
background:rgba(0,0,0,.5);
}

.btn:hover{
transform:translateY(-5px);
box-shadow:0 12px 0 #5b470c,0 22px 40px rgba(0,0,0,.8);
}

/* CEO */

.ceo-section{
padding:30px 0;
background:radial-gradient(circle at 10% 50%,rgba(217,173,56,.08),transparent 25%);
}

.ceo{
display:grid;
grid-template-columns:210px 1fr;
gap:35px;
align-items:center;
}

.ceo-photo{
height:145px;
padding:5px;
border:1px solid var(--gold);
background:linear-gradient(145deg,#fff0a0,#8c6816,#f5c542,#322500);
box-shadow:0 20px 40px rgba(0,0,0,.8),0 0 25px rgba(217,173,56,.15);
transform:perspective(900px) rotateY(4deg);
}

.ceo-photo img{
width:100%;
height:100%;
object-fit:cover;
display:block;
border:1px solid #080808;
}

.ceo h2{
font-size:30px;
}

.role{
color:var(--gold2);
font-size:8px;
font-weight:bold;
letter-spacing:1px;
}

/* ABOUT */

.about{
display:grid;
grid-template-columns:300px 1fr;
gap:55px;
align-items:center;
}

.photo-box{
width:300px;
height:230px;
padding:5px;
border:1px solid var(--gold);
background:linear-gradient(145deg,#f5c542,#17130a,#8c6816);
box-shadow:15px 18px 0 rgba(217,173,56,.035),0 25px 50px rgba(0,0,0,.8);
transform:perspective(900px) rotateY(-5deg);
}

.photo-box img{
width:100%;
height:100%;
object-fit:cover;
}

.checks{
margin-top:20px;
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.checks div{
color:#ccc;
font-size:9px;
}

.checks b{
color:var(--gold2);
margin-right:7px;
}

/* BUSINESS */

.business-head{
display:grid;
grid-template-columns:290px 1fr;
gap:45px;
align-items:center;
}

.business-photos{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
}

.pic{
height:125px;
position:relative;
overflow:hidden;
border:1px solid #3d341d;
border-radius:6px;
background:#080909;
box-shadow:0 15px 30px rgba(0,0,0,.7);
transition:.4s;
transform:perspective(800px) rotateX(2deg);
}

.pic:hover{
transform:perspective(800px) rotateX(-4deg) translateY(-7px);
border-color:var(--gold);
}

.pic img{
width:100%;
height:100%;
object-fit:cover;
transition:.6s;
}

.pic:hover img{
transform:scale(1.1);
}

.pic:after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(transparent 30%,rgba(0,0,0,.9));
}

.pic span{
position:absolute;
left:10px;
bottom:9px;
z-index:2;
font-size:8px;
font-weight:bold;
}

/* SERVICES */

.services-wrap{
display:grid;
grid-template-columns:290px 1fr;
gap:45px;
align-items:center;
}

.services{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:1px;
background:#292c2d;
border:1px solid #292c2d;
box-shadow:0 20px 40px rgba(0,0,0,.6);
}

.service{
min-height:120px;
padding:20px;
background:linear-gradient(145deg,#141718,#070808);
transition:.35s;
}

.service:hover{
background:linear-gradient(145deg,#1d1a12,#080909);
box-shadow:inset 0 0 30px rgba(217,173,56,.06);
transform:translateY(-3px);
}

.service-icon{
color:var(--gold2);
font-size:25px;
text-shadow:0 0 15px rgba(217,173,56,.25);
}

.service h3{
margin-top:6px;
font-size:10px;
}

.service p{
margin-top:4px;
color:#777;
font-size:8px;
}

/* PRODUCTS */

.products{
display:grid;
grid-template-columns:290px 1fr;
gap:45px;
align-items:center;
}

.product-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px;
}

.product{
overflow:hidden;
background:linear-gradient(145deg,#141718,#070808);
border:1px solid #292929;
box-shadow:0 15px 30px rgba(0,0,0,.7);
transition:.35s;
}

.product:hover{
transform:translateY(-7px);
border-color:var(--gold);
box-shadow:0 25px 45px rgba(0,0,0,.85),0 0 20px rgba(217,173,56,.12);
}

.product-img{
height:125px;
overflow:hidden;
}

.product-img img{
width:100%;
height:100%;
object-fit:cover;
transition:.5s;
}

.product:hover .product-img img{
transform:scale(1.08);
}

.product-info{
padding:14px;
}

.product h3{
font-size:10px;
}

.product p{
margin-top:5px;
color:#777;
font-size:8px;
}

/* STATS */

.stats{
padding:35px 0;
background:
linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.9)),
url("https://images.unsplash.com/photo-1565610222536-ef125c59da2e?auto=format&fit=crop&w=2000&q=90")
center/cover fixed;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
text-align:center;
}

.stat{
border-right:1px solid #444;
}

.stat:last-child{
border:0;
}

.stat strong{
display:block;
color:var(--gold2);
font-size:35px;
text-shadow:0 0 20px rgba(217,173,56,.25);
}

.stat span{
font-size:8px;
font-weight:bold;
}

/* LEADERSHIP */

.leadership{
display:grid;
grid-template-columns:1fr 1.4fr;
gap:50px;
align-items:center;
}

.lead-photo{
width:190px;
height:235px;
padding:5px;
border:1px solid var(--gold);
background:linear-gradient(145deg,#f5c542,#111,#8b6818);
box-shadow:15px 18px 0 rgba(217,173,56,.03),0 25px 45px rgba(0,0,0,.8);
}

.lead-photo img{
width:100%;
height:100%;
object-fit:cover;
}

.mission-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin-top:20px;
}

.mission{
padding:22px;
border:1px solid #292929;
background:linear-gradient(145deg,#151718,#080909);
box-shadow:8px 8px 0 rgba(217,173,56,.025),0 15px 30px rgba(0,0,0,.5);
}

.mission h3{
color:var(--gold2);
font-size:12px;
margin-bottom:8px;
}

.mission p{
color:#777;
font-size:8px;
}

/* WHY */

.why-grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
margin-top:27px;
}

.why{
padding:22px 10px;
text-align:center;
border:1px solid #252727;
background:linear-gradient(145deg,#111414,#070808);
box-shadow:0 12px 25px rgba(0,0,0,.5);
transition:.35s;
}

.why:hover{
transform:translateY(-7px);
border-color:var(--gold);
}

.why-icon{
color:var(--gold2);
font-size:26px;
}

.why h3{
margin:7px 0;
font-size:9px;
}

.why p{
color:#777;
font-size:7px;
}

/* VALUES */

.values{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin-top:25px;
}

.value{
padding:22px;
border:1px solid #292929;
background:linear-gradient(145deg,#141617,#080909);
box-shadow:10px 10px 0 rgba(217,173,56,.025),0 15px 30px rgba(0,0,0,.55);
transition:.3s;
}

.value:hover{
transform:translateY(-6px);
border-color:var(--gold);
}

.stars{
color:var(--gold2);
}

.value h3{
font-size:11px;
margin:7px 0;
}

.value p{
color:#777;
font-size:8px;
}

/* ================= ENGAGEMENT ================= */

.engagement-section{
background:
radial-gradient(circle at 50% 50%,rgba(217,173,56,.1),transparent 45%),
#040506;
overflow:hidden;
}

.engagement-heading{
text-align:center;
margin-bottom:30px;
}

.engagement-card{
max-width:900px;
min-height:420px;
position:relative;
overflow:hidden;
margin:auto;
padding:28px;
text-align:center;

border:1px solid var(--gold);
border-radius:20px;

background:
linear-gradient(145deg,#181818,#050505 45%,#171208);

box-shadow:
0 35px 80px rgba(0,0,0,.9),
0 0 40px rgba(217,173,56,.12),
inset 0 0 40px rgba(217,173,56,.04);

transform:perspective(1200px) rotateX(1deg);
}

.engagement-card:before{
content:"";
position:absolute;
inset:10px;
border:1px solid rgba(217,173,56,.3);
border-radius:13px;
pointer-events:none;
}

.engagement-card:after{
content:"";
position:absolute;
width:550px;
height:550px;
left:50%;
top:50%;
transform:translate(-50%,-50%);
background:radial-gradient(circle,rgba(217,173,56,.08),transparent 65%);
pointer-events:none;
}

.eng-top{
position:relative;
z-index:3;
display:flex;
justify-content:space-between;
color:var(--gold2);
font-size:9px;
letter-spacing:2px;
}

.eng-top b{
font-size:11px;
}

.rings{
position:relative;
z-index:3;
font-size:32px;
margin:8px 0;
filter:drop-shadow(0 0 15px rgba(217,173,56,.45));
}

.eng-content{
position:relative;
z-index:3;
display:flex;
align-items:center;
justify-content:center;
gap:60px;
}

.person{
width:200px;
}

.person-photo{
width:135px;
height:135px;
padding:4px;
margin:auto;
border-radius:50%;
background:linear-gradient(145deg,#fff0a0,#d9ad38,#5c4307,#f5c542);
box-shadow:0 15px 35px rgba(0,0,0,.9),0 0 25px rgba(217,173,56,.2);
}

.person-photo img{
width:100%;
height:100%;
object-fit:cover;
display:block;
border-radius:50%;
border:2px solid #070707;
}

.person small{
display:block;
margin-top:10px;
color:#777;
font-size:7px;
letter-spacing:2px;
}

.person h3{
color:var(--gold2);
font-size:20px;
}

/* IQRA 3D */

.iqra-3d{
width:135px;
height:135px;
margin:auto;
position:relative;

display:flex;
align-items:center;
justify-content:center;
flex-direction:column;

border-radius:50%;

background:
radial-gradient(
circle at 35% 25%,
#fff1a8 0%,
#d9ad38 18%,
#72530b 48%,
#090909 72%,
#000 100%
);

border:4px solid #d9ad38;

box-shadow:
0 0 0 3px #17120a,
0 0 0 5px #80651d,
0 18px 35px rgba(0,0,0,.9),
0 0 35px rgba(217,173,56,.3),
inset 0 0 25px rgba(255,223,114,.25);

transform:perspective(800px) rotateY(-5deg);

animation:iqraFloat 4s ease-in-out infinite;
}

.iqra-3d:before{
content:"";
position:absolute;
inset:8px;
border:1px solid rgba(255,230,130,.7);
border-radius:50%;
box-shadow:inset 0 0 20px rgba(255,223,114,.2);
}

.iqra-ring{
position:absolute;
top:15px;
color:#fff0a0;
font-size:16px;
text-shadow:0 0 10px #d9ad38;
}

.iqra-letter{
color:#fff4b5;
font-family:Georgia,serif;
font-size:48px;
font-weight:bold;
line-height:1;
text-shadow:2px 3px 0 #684d08,0 0 15px rgba(255,223,114,.6);
}

.iqra-name{
margin-top:2px;
color:#fff1a0;
font-size:13px;
font-weight:900;
letter-spacing:3px;
text-shadow:0 2px 3px #000,0 0 10px rgba(255,223,114,.45);
}

.iqra-person small{
color:#d9ad38!important;
letter-spacing:2px;
}

@keyframes iqraFloat{

0%,100%{
transform:perspective(800px) rotateY(-5deg) translateY(0);
}

50%{
transform:perspective(800px) rotateY(5deg) translateY(-7px);
}

}

.heart{
display:flex;
flex-direction:column;
align-items:center;
}

.heart span{
color:var(--gold2);
font-size:43px;
text-shadow:0 0 20px rgba(217,173,56,.5);
animation:heart 1.5s infinite;
}

.heart small{
color:#777;
font-size:7px;
letter-spacing:1px;
}

@keyframes heart{
0%,100%{transform:scale(1)}
50%{transform:scale(1.15)}
}

.eng-date{
position:relative;
z-index:3;
width:150px;
margin:20px auto 12px;
padding:8px;
border-top:1px solid #80651d;
border-bottom:1px solid #80651d;
}

.eng-date span{
display:block;
color:#777;
font-size:7px;
letter-spacing:2px;
}

.eng-date strong{
display:block;
color:var(--gold2);
font-size:38px;
line-height:1;
}

.eng-date small{
color:#aaa;
font-size:8px;
}

.eng-bottom{
position:relative;
z-index:3;
display:flex;
justify-content:center;
align-items:center;
gap:15px;
}

.eng-bottom span{
color:var(--gold2);
}

.eng-bottom p{
color:#777;
font-size:8px;
letter-spacing:1px;
}

/* GALLERY */

.gallery-grid{
margin-top:28px;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:13px;
}

.gallery-card{
height:180px;
position:relative;
overflow:hidden;
border:1px solid #292929;
border-radius:8px;
background:#080909;
box-shadow:0 18px 35px rgba(0,0,0,.7);
transition:.4s;
}

.gallery-card.large{
grid-column:span 2;
grid-row:span 2;
height:373px;
}

.gallery-card img{
width:100%;
height:100%;
object-fit:cover;
display:block;
transition:.6s;
}

.gallery-card:after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(transparent 25%,rgba(0,0,0,.9));
}

.gallery-card span{
position:absolute;
z-index:2;
left:13px;
bottom:12px;
font-size:8px;
font-weight:bold;
letter-spacing:1px;
}

.gallery-card:hover{
transform:perspective(900px) rotateX(-3deg) translateY(-7px);
border-color:var(--gold);
box-shadow:0 28px 50px rgba(0,0,0,.9),0 0 25px rgba(217,173,56,.15);
}

.gallery-card:hover img{
transform:scale(1.1);
}

/* FINAL */

.final-banner{
min-height:430px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
position:relative;

background:
url("https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=2200&q=90")
center/cover fixed;
}

.final-overlay{
position:absolute;
inset:0;
background:linear-gradient(90deg,rgba(0,0,0,.96),rgba(0,0,0,.5),rgba(0,0,0,.96));
}

.final-content{
position:relative;
z-index:2;
}

.final-year{
color:rgba(255,223,114,.12);
font-size:120px;
line-height:.8;
font-weight:900;
letter-spacing:10px;
}

.final-content h2{
font-size:45px;
line-height:1;
}

.final-content h2 span{
color:var(--gold2);
}

.final-content p{
margin:18px 0 27px;
color:#bbb;
font-size:9px;
letter-spacing:3px;
}

/* CONTACT */

.contact{
display:grid;
grid-template-columns:1fr 1fr;
gap:45px;
align-items:center;
}

.contact-info{
display:grid;
gap:10px;
margin-top:20px;
}

.contact-item{
padding:12px 15px;
border-left:2px solid var(--gold);
background:linear-gradient(90deg,#111314,#070808);
box-shadow:0 8px 18px rgba(0,0,0,.45);
}

.contact-item span{
display:block;
color:#666;
font-size:7px;
}

.contact-item strong{
font-size:10px;
}

.contact-box{
min-height:280px;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
padding:30px;

border:1px solid var(--gold);

background:
linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.88)),
url("https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=1400&q=90")
center/cover;

box-shadow:0 25px 50px rgba(0,0,0,.8);
}

.contact-box h2{
font-size:33px;
}

.contact-box h2 span{
color:var(--gold2);
}

.contact-box p{
margin:5px 0 20px;
color:#ccc;
font-size:8px;
}

.whatsapp{
background:#16c76a;
border-color:#16c76a;
color:#fff;
box-shadow:0 7px 0 #087d42,0 15px 30px rgba(0,0,0,.6);
}

/* FOOTER */

footer{
padding:45px 0 18px;
background:#020202;
}

.footer-grid{
display:grid;
grid-template-columns:2fr 1fr 1fr;
gap:45px;

footer h3{
